








<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crew LR Data Form - South East Central Railway</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      background:linear-gradient(135deg,#b1d5e6 0%,#87ceeb 100%);
      font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
      padding:16px; min-height:100vh;
    }
    .container{
      max-width:1100px; margin:0 auto;
      background:rgb(138,201,241);
      border-radius:15px;
      box-shadow:0 10px 40px rgba(0,0,0,0.2);
      overflow:hidden;
    }
    .header{
      background:linear-gradient(135deg,#1a237e 0%,#283593 100%);
      color:#fff; border-bottom:4px solid #FFD700;
      padding:12px 18px;
    }
    .header-inner{display:flex;align-items:center;gap:14px;}
    .header-text{text-align:center;flex:1;}
    .header-text .hindi{font-size:1.4em;font-weight:bold;letter-spacing:1px;text-shadow:1px 1px 3px rgba(0,0,0,.3);}
    .header-text .sub{font-size:0.82em;color:#FFD700;font-weight:bold;letter-spacing:1px;margin-top:3px;text-transform:uppercase;}
    .header-text .sub2{font-size:0.75em;color:#FFD700;opacity:.85;letter-spacing:.5px;}
    .form-container{padding:18px;background:#e4e7e7;}
    .section{
      background:rgb(212,220,218);padding:15px;margin-bottom:16px;
      border-radius:8px;box-shadow:0 4px 15px rgba(0,0,0,.1);
    }
    .section-title{
      font-size:0.95em;font-weight:bold;
      background:linear-gradient(135deg,#1a237e,#3949ab);
      color:#fff;padding:7px 12px;border-radius:5px;
      letter-spacing:1px;margin-bottom:14px;text-transform:uppercase;text-align:center;
    }
    .fields-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 20px;}
    .fields-grid.cols-3{grid-template-columns:repeat(3,1fr);}
    .field-pair{display:grid;grid-template-columns:140px 1fr;align-items:center;gap:0 10px;}
    .field-pair label{font-size:12px;font-weight:bold;color:#1a237e;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;}
    input[type="text"],input[type="date"],input[type="time"],input[type="number"],select,textarea{
      width:100%;padding:7px 9px;border:2px solid #b3d9ff;border-radius:5px;
      font-size:12px;font-weight:bold;background:#fff;
      transition:border-color .3s,box-shadow .3s;color:#1a237e;height:34px;
    }
    textarea{height:auto;}
    input:focus,select:focus,textarea:focus{outline:none;border-color:#4a90e2;box-shadow:0 0 8px rgba(74,144,226,.3);}
    input[type="text"]{text-transform:uppercase;}
    #entriesWrap{display:flex;flex-direction:column;gap:14px;}
    .entry-card{background:#fff;border:2px solid #b3d9ff;border-radius:8px;box-shadow:0 4px 15px rgba(0,0,0,.08);overflow:hidden;}
    .entry-card-head{
      background:linear-gradient(135deg,#1a237e 0%,#4a8ec2 100%);color:#fff;
      padding:7px 12px;display:flex;align-items:center;justify-content:space-between;
    }
    .entry-card-head .entry-num{font-size:12px;font-weight:bold;letter-spacing:.5px;text-transform:uppercase;}
    .entry-card-body{padding:14px;background:#f0f8ff;}
    .entry-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 20px;}
    .entry-field{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:0 10px;}
    .entry-field label{font-size:11px;font-weight:bold;color:#1a237e;text-transform:uppercase;letter-spacing:.3px;}
    .entry-field.full{grid-column:1/-1;grid-template-columns:110px 1fr;align-items:start;}
    .entry-field.full label{padding-top:7px;}
    .entry-field textarea{resize:vertical;min-height:42px;height:auto;}
    .stn-row{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
    .stn-field{display:flex;flex-direction:column;gap:4px;}
    .stn-field label{font-size:10px;font-weight:bold;color:#1a237e;text-transform:uppercase;letter-spacing:.3px;text-align:center;}
    .stn-field input{height:32px;text-align:center;padding:6px 4px;}
    .stn-field select{height:32px;text-align:center;padding:4px;text-align-last:center;}
    .btn-row{display:flex;gap:10px;margin-top:14px;justify-content:center;flex-wrap:wrap;}
    .btn{padding:8px 18px;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:bold;transition:all .3s;text-transform:uppercase;letter-spacing:.5px;}
    .btn-green{background:linear-gradient(135deg,#27ae60,#229954);color:#fff;}
    .btn-green:hover{background:linear-gradient(135deg,#229954,#1e8449);transform:translateY(-1px);}
    .btn-green:disabled{background:#aaa;cursor:not-allowed;transform:none;}
    .btn-blue{background:linear-gradient(135deg,#1a237e,#3949ab);color:#fff;}
    .btn-blue:hover{background:linear-gradient(135deg,#283593,#1a237e);transform:translateY(-1px);}
    .btn-blue:disabled{background:#aaa;cursor:not-allowed;transform:none;}
    .btn-red{background:linear-gradient(135deg,#c0392b,#e74c3c);color:#fff;}
    .btn-red:hover{background:linear-gradient(135deg,#a93226,#c0392b);transform:translateY(-1px);}
    .btn-grey{background:linear-gradient(135deg,#616161,#757575);color:#fff;}
    .btn-grey:hover{background:linear-gradient(135deg,#4d4d4d,#616161);transform:translateY(-1px);}
    .delete-btn{background:#e74c3c;color:#fff;border:none;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:10px;font-weight:bold;text-transform:uppercase;letter-spacing:.3px;}
    .delete-btn:hover{background:#c0392b;}
    #toast{
      display:none;position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
      padding:12px 28px;border-radius:8px;font-size:14px;font-weight:bold;
      color:#fff;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,0.3);
      animation:fadeIn .3s ease;
    }
    #toast.success{background:#27ae60;}
    #toast.error{background:#e74c3c;}
    #toast.info{background:#1a237e;}
    @keyframes fadeIn{from{opacity:0;bottom:15px;}to{opacity:1;bottom:30px;}}
    @keyframes fadeInMobile{from{opacity:0;bottom:85px;}to{opacity:1;bottom:100px;}}
    .combo-suggest{
      display:none;position:absolute;top:100%;left:0;right:0;z-index:500;
      background:#fff;border:2px solid #4a90e2;border-top:none;border-radius:0 0 6px 6px;
      max-height:220px;overflow-y:auto;box-shadow:0 8px 20px rgba(0,0,0,.18);
    }
    .combo-suggest.open{display:block;}
    .combo-suggest .combo-item{
      padding:8px 10px;font-size:12px;font-weight:bold;color:#1a237e;cursor:pointer;
      text-transform:uppercase;border-bottom:1px solid #eef3fb;
    }
    .combo-suggest .combo-item:last-child{border-bottom:none;}
    .combo-suggest .combo-item:hover,.combo-suggest .combo-item.active{background:#e3f0ff;}
    .combo-suggest .combo-empty{padding:8px 10px;font-size:12px;color:#888;font-style:italic;}
    input.combo-invalid{border-color:#e74c3c !important;box-shadow:0 0 8px rgba(231,76,60,.35) !important;}
    .field-invalid{border-color:#e74c3c !important;box-shadow:0 0 8px rgba(231,76,60,.35) !important;background:#fff5f5 !important;}
    input[type="text"][readonly]{
      background:linear-gradient(135deg,#e8f5e9,#f1f8e9);
      color:#1a237e;
      cursor:not-allowed;
      border-color:#66bb6a;
      font-style:italic;
    }
    html{-webkit-text-size-adjust:100%;}
    /* ── Saving / Saved overlay ── */
    .save-overlay{
      display:none;position:fixed;inset:0;z-index:5000;
      background:rgba(15,23,42,.55);align-items:center;justify-content:center;padding:16px;
    }
    .save-overlay.open{display:flex;}
    .save-card{
      background:#fff;border-radius:18px;width:100%;max-width:440px;
      padding:30px 20px 26px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);
      animation:popIn .25s ease;
    }
    @keyframes popIn{from{opacity:0;transform:scale(.92);}to{opacity:1;transform:scale(1);}}
    .save-ring{position:relative;width:96px;height:96px;margin:0 auto 22px;}
    .save-ring .ring{
      position:absolute;inset:0;border-radius:50%;
      border:9px solid #d9f2e0;border-top-color:#16a34a;
      animation:spin 1s linear infinite;
    }
    .save-ring .ring-icon{
      position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;
    }
    @keyframes spin{to{transform:rotate(360deg);}}
    .save-card.done .ring{animation:none;border-color:#16a34a;background:#e8f8ee;}
    .save-card.done .ring-icon{animation:checkPop .4s ease;}
    @keyframes checkPop{0%{transform:scale(.3);opacity:0;}70%{transform:scale(1.2);}100%{transform:scale(1);opacity:1;}}
    .save-title{font-size:22px;font-weight:800;color:#16a34a;text-transform:uppercase;letter-spacing:.5px;}
    .save-sub{font-size:15px;font-weight:700;color:#15803d;margin-top:10px;}
    .save-ok{
      display:none;margin:20px auto 0;padding:10px 36px;border:none;border-radius:8px;
      background:linear-gradient(135deg,#27ae60,#229954);color:#fff;font-size:14px;font-weight:bold;
      text-transform:uppercase;letter-spacing:.5px;cursor:pointer;
    }
    .save-card.done .save-ok{display:inline-block;}
    /* 3D "Click to Open Dashboard" button — DESKTOP ONLY (hidden on mobile via .desk-only) */
    @media (min-width:701px){
      .dash-3d{
        display:inline-block;padding:6px 14px;background:#000;color:#00ffff;
        font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:.5px;
        border:1px solid #00e5ff;border-radius:7px;text-decoration:none;
        text-shadow:0 0 8px rgba(0,255,255,.7);
        box-shadow:0 1px 0 #008b8b,0 2px 0 #007a7a,0 3px 0 #006b6b,0 4px 0 #005c5c,
                   0 8px 14px rgba(0,0,0,.5),0 0 14px rgba(0,255,255,.35),inset 0 1px 0 rgba(0,255,255,.35);
        transform:translateY(0);
        transition:transform .15s ease,box-shadow .15s ease,text-shadow .15s ease;
      }
      .dash-3d:hover{
        transform:translateY(-2px);text-shadow:0 0 12px rgba(0,255,255,.95);
        box-shadow:0 1px 0 #008b8b,0 2px 0 #007a7a,0 3px 0 #006b6b,0 4px 0 #005c5c,0 5px 0 #004d4d,
                   0 11px 18px rgba(0,0,0,.55),0 0 22px rgba(0,255,255,.6),inset 0 1px 0 rgba(0,255,255,.45);
      }
      .dash-3d:active{
        transform:translateY(3px);
        box-shadow:0 1px 0 #005c5c,0 3px 6px rgba(0,0,0,.5),0 0 10px rgba(0,255,255,.4),inset 0 2px 4px rgba(0,0,0,.6);
      }
    }
    /* Bottom nav is MOBILE ONLY — hidden on desktop so the original desktop layout is untouched */
    .bottom-nav{display:none;}
    @media (max-width:700px){
    body{padding-bottom:104px;}
    .desk-only{display:none !important;}
    #toast{bottom:100px;animation-name:fadeInMobile;}
    /* ── Bottom navigation bar ── */
    .bottom-nav{
      display:block;position:fixed;left:0;right:0;bottom:0;z-index:1000;
      background:#e4e7e7;padding:8px 8px calc(8px + env(safe-area-inset-bottom));
      box-shadow:0 -4px 16px rgba(0,0,0,.25);
    }
    .bottom-nav-inner{display:flex;gap:8px;max-width:1100px;margin:0 auto;}
    .nav-btn{
      flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
      padding:9px 2px 7px;background:#111;color:#fff;border:none;border-bottom:4px solid #888;
      border-radius:10px;cursor:pointer;text-decoration:none;font-family:inherit;
      box-shadow:0 3px 8px rgba(0,0,0,.35);transition:transform .15s,background .2s;
      -webkit-tap-highlight-color:transparent;
    }
    .nav-btn:hover{background:#222;}
    .nav-btn:active{transform:scale(.96);}
    .nav-btn:disabled{opacity:.6;cursor:not-allowed;}
    .nav-btn .nav-ico{font-size:18px;line-height:1;}
    .nav-btn .nav-lbl{
      font-size:10px;font-weight:bold;letter-spacing:.3px;text-transform:uppercase;
      white-space:normal;text-align:center;line-height:1.15;max-width:100%;overflow-wrap:anywhere;
    }
    .nav-btn{overflow:hidden;min-height:58px;}
    @media (max-width:420px){.nav-btn .nav-lbl{font-size:9px;letter-spacing:.2px;}}
    .nav-dash{border-bottom-color:#8e44ad;}
    .nav-submit{border-bottom-color:#27ae60;}
    .nav-pdf{border-bottom-color:#e67e22;}
    .nav-reset{border-bottom-color:#2980b9;}
    }
    @media (max-width:700px){
      /* Full-screen layout: remove outer gutters so the form uses the whole width */
      body{padding:0;background:#e4e7e7;}
      .container{max-width:100%;width:100%;border-radius:0;box-shadow:none;}
      .header{padding:10px 12px;}
      .header-text .hindi{font-size:1.1em;}
      .form-container{padding:8px;}
      .section{padding:10px;margin-bottom:10px;border-radius:6px;}
      .section-title{font-size:0.85em;margin-bottom:10px;}

      /* Stack every label above its text box; boxes fill the full width */
      .fields-grid,.fields-grid.cols-3{grid-template-columns:1fr;gap:12px;}
      .field-pair,
      .entry-field,.entry-field.full{
        grid-template-columns:1fr;
        gap:4px 0;
        align-items:stretch;
      }
      .field-pair label,.entry-field label{
        white-space:normal;
        font-size:12px;
        padding-top:0 !important;
      }
      .field-pair > div,
      .field-pair .combo-wrap{width:100%;min-width:0;}

      /* Bigger, full-width touch-friendly inputs (16px stops iOS auto-zoom) */
      input[type="text"],input[type="date"],input[type="time"],input[type="number"],select,textarea{
        width:100%;
        max-width:100%;
        min-width:0;
        font-size:16px;
        height:44px;
        padding:8px 10px;
        -webkit-appearance:none;
        appearance:none;
      }
      select{
        background-image:linear-gradient(45deg,transparent 50%,#1a237e 50%),linear-gradient(135deg,#1a237e 50%,transparent 50%);
        background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;
        background-size:6px 6px,6px 6px;
        background-repeat:no-repeat;
        padding-right:32px;
      }
      input[type="date"]{display:block;}

      /* Entry cards */
      #entriesWrap{gap:10px;}
      .entry-card-body{padding:10px;}
      .entry-grid{grid-template-columns:1fr;gap:12px;}
      .stn-row{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
      .stn-field label{font-size:11px;}
      .stn-field input,.stn-field select{height:44px;font-size:16px;}
      .stn-field:last-child{grid-column:1/-1;}   /* Line selector spans full width */

      /* Crew-name suggestions and buttons */
      .combo-suggest{max-height:50vh;}
      .combo-suggest .combo-item{padding:12px 10px;font-size:14px;}
      .delete-btn{padding:8px 12px;font-size:11px;}
      .btn-row{flex-direction:column;align-items:stretch;}
      .btn-row .btn{width:100%;padding:12px 16px;font-size:13px;}
      #toast{width:calc(100% - 24px);max-width:none;text-align:center;font-size:13px;padding:10px 14px;}
    }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="header-inner">
      <div class="header-text">
        <div class="hindi"> RRB ALP LR DATA ENTRY FORM</div>
        <div class="sub">South East Central Railway</div>
        <div class="sub2">Raipur Division</div>
      </div>
    </div>
  </div>

  <div class="form-container">

    <div class="desk-only" style="text-align:right;margin-bottom:16px;">
      <a class="dash-3d" href="https://raipurdivision.github.io/DASHBOARD-LR-DATA/" target="_blank" rel="noopener">
        📊 Click to Open Dashboard
      </a>
    </div>

    <!-- Crew Details -->
    <div class="section">
      <div class="section-title">Crew Details</div>
      <div class="fields-grid cols-3">
        <div class="field-pair">
          <label>Date</label>
          <input type="date" id="crewDate">
        </div>
        <div class="field-pair">
          <label>Crew Name</label>
          <div style="display:flex;gap:6px;align-items:center;position:relative;flex:1;">
            <div class="combo-wrap" style="position:relative;flex:1;">
              <input type="text" id="crewName" placeholder="Type to search and select from list" autocomplete="off" style="flex:1;width:100%;">
              <div id="crewNameSuggest" class="combo-suggest"></div>
            </div>
            <button type="button" class="btn btn-blue" onclick="loadCrewList()" title="Refresh crew list from Google Sheet" style="padding:5px 9px;white-space:nowrap;font-size:11px;height:34px;">&#x1F504;</button>
          </div>
        </div>
        <div class="field-pair">
          <label>HQ</label>
          <input type="text" id="hq">
        </div>
        <div class="field-pair">
          <label>Designation</label>
          <input type="text" id="designation">
        </div>
        <div class="field-pair">
          <label>CMS ID</label>
          <input type="text" id="cmsId" list="cmsIdList" placeholder="Type to search or enter manually" autocomplete="off">
          <datalist id="cmsIdList"></datalist>
        </div>
        <div class="field-pair">
          <label>Group CLI</label>
          <select id="groupCli" onchange="this.classList.remove('field-invalid')">
            <option value="">-- Select Group CLI --</option>
            <option value="A K REDDY/CLI/R">A K REDDY/CLI/R</option>
            <option value="A R TARAM/CLI/BIA">A R TARAM/CLI/BIA</option>
            <option value="A.R. TARAM/CLI/BIA">A.R. TARAM/CLI/BIA</option>
            <option value="ABDUL MOIN KHAN/CLI/BIA">ABDUL MOIN KHAN/CLI/BIA</option>
            <option value="AKHILESH KUMAR/CLI/BIA">AKHILESH KUMAR/CLI/BIA</option>
            <option value="AMIT KUMAR BANKURE/CLI/BIA">AMIT KUMAR BANKURE/CLI/BIA</option>
            <option value="ANANT PRAKASH SHRIVASTAVA/CLI/BIA">ANANT PRAKASH SHRIVASTAVA/CLI/BIA</option>
            <option value="ANIL KUMAR/CLI/BIA">ANIL KUMAR/CLI/BIA</option>
            <option value="ANKIT RAM KANT/CLI/BIA">ANKIT RAM KANT/CLI/BIA</option>
            <option value="ASHISH WANJARI/CLI/BIA">ASHISH WANJARI/CLI/BIA</option>
            <option value="AVON KUMAR SAHU/CLI/R">AVON KUMAR SAHU/CLI/R</option>
            <option value="B B KUSHWAHA/CLI/BIA">B B KUSHWAHA/CLI/BIA</option>
            <option value="B K HARMUKH/CLI/BIA">B K HARMUKH/CLI/BIA</option>
            <option value="B K KARNAR/CLI/BIA">B K KARNAR/CLI/BIA</option>
            <option value="B. K. SAHA/CLI/BIA">B. K. SAHA/CLI/BIA</option>
            <option value="B.K.SONI/CLI/BIA">B.K.SONI/CLI/BIA</option>
            <option value="BAL KRISHNA/CLI/BYT">BAL KRISHNA/CLI/BYT</option>
            <option value="BALESHWAR PAHAN/CLI/BYT">BALESHWAR PAHAN/CLI/BYT</option>
            <option value="BHARAT SINGH ATBHAIYYA/CLI/R">BHARAT SINGH ATBHAIYYA/CLI/R</option>
            <option value="BHOLI CHAUDHARY/CLI/R">BHOLI CHAUDHARY/CLI/R</option>
            <option value="BHOLI CHOUDHARY/CLI/R">BHOLI CHOUDHARY/CLI/R</option>
            <option value="BIKRAMJIT KANRAR/CLI/BIA">BIKRAMJIT KANRAR/CLI/BIA</option>
            <option value="BINOD KUMAR RAM/CLI/R">BINOD KUMAR RAM/CLI/R</option>
            <option value="BRIJESH YADAV/CLI/BYT">BRIJESH YADAV/CLI/BYT</option>
            <option value="CLI NAME/CLI/BIA">CLI NAME/CLI/BIA</option>
            <option value="DEEPAK KUMAR SWARNAKAR/CLI/BYT">DEEPAK KUMAR SWARNAKAR/CLI/BYT</option>
            <option value="DEEPANNITA PUNTAMBEKAR/CLI/BIA">DEEPANNITA PUNTAMBEKAR/CLI/BIA</option>
            <option value="DHANESH KUMAR/CLI/BYT">DHANESH KUMAR/CLI/BYT</option>
            <option value="DILLI RAO/CLI/BIA">DILLI RAO/CLI/BIA</option>
            <option value="G. C. BISWAS/CLI/R">G. C. BISWAS/CLI/R</option>
            <option value="G. V. R. K. MADHU/CLI/BIA">G. V. R. K. MADHU/CLI/BIA</option>
            <option value="GHANA RAM SAHU/CLI/BIA">GHANA RAM SAHU/CLI/BIA</option>
            <option value="GIRDHARI LAL/CLI/R">GIRDHARI LAL/CLI/R</option>
            <option value="GIRISH KUMAR VERMA/CLI/BYT">GIRISH KUMAR VERMA/CLI/BYT</option>
            <option value="HARESH SHRAWAN/CLI/BIA">HARESH SHRAWAN/CLI/BIA</option>
            <option value="JAISHANKAR SHARMA/CLI/BIA">JAISHANKAR SHARMA/CLI/BIA</option>
            <option value="JITENDRA KUMAR MISHRA/CLI/BIA">JITENDRA KUMAR MISHRA/CLI/BIA</option>
            <option value="K P HIRWANI/CLI/BIA">K P HIRWANI/CLI/BIA</option>
            <option value="K P LAHRE/CLI/BIA">K P LAHRE/CLI/BIA</option>
            <option value="K. K. SAHU/CLI/BIA">K. K. SAHU/CLI/BIA</option>
            <option value="KAMLESH KUMAR RAJABHOJ/CLI/BIA">KAMLESH KUMAR RAJABHOJ/CLI/BIA</option>
            <option value="KHUSHAL SINGH/CLI/DRZ">KHUSHAL SINGH/CLI/DRZ</option>

<script>
  // ── Google Apps Script Web App URL ──
  // Replace with your deployed Apps Script /exec URL
  const SHEET_URL = 'https://script.google.com/macros/s/AKfycbwY5UqahR2epqWmzcOtdPXE-BjJ-NwUfSbJuQozbXubTvL0ziWCBQHhYQszfVM8zpD8cA/exec';

  // ── Crew List source: Google Sheet "LR CREW LIST" ──
  const CREW_SHEET_ID   = '1EaTu-GupuM_nM4K1sHe2q2l_QVjdUjxHqgpXjiiu_ag';
  const CREW_SHEET_NAME = 'Sheet1';
  const CREW_CSV_URL    = `https://docs.google.com/spreadsheets/d/${CREW_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(CREW_SHEET_NAME)}`;

  // CORS proxy fallbacks — tried in order until one works
  const CREW_CORS_PROXIES = [
    url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    url => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
    url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
  ];

  let crewData = {};     // NAME -> { hq, designation, cmsId }
  let crewByCmsId = {};  // CMS ID -> { name, hq, designation }

  function parseCrewCSV(text) {
    const rows = [];
    const lines = text.split(/\r?\n/);
    for (const line of lines) {
      if (!line.trim()) continue;
      const row = [];
      let cur = '', inQ = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') { inQ = !inQ; }
        else if (ch === ',' && !inQ) { row.push(cur.trim()); cur = ''; }
        else { cur += ch; }
      }
      row.push(cur.trim());
      rows.push(row);
    }
    return rows;
  }

  function populateCrewDatalist(rows) {
    if (rows.length < 2) throw new Error('Sheet has no data rows');

    const headers = rows[0].map(h => String(h).trim().toUpperCase());
    const nameIdx  = headers.findIndex(h => h.includes('NAME'));
    const hqIdx    = headers.findIndex(h => h === 'HQ' || h.includes('H.Q') || h.includes('HEAD'));
    const desigIdx = headers.findIndex(h => h.includes('DESIG'));
    const cmsIdx   = headers.findIndex(h => h.includes('CMS'));

    if (nameIdx < 0) throw new Error('NAME column not found in sheet. Check headers.');

    crewData = {};
    crewByCmsId = {};
    const cmsDl = document.getElementById('cmsIdList');
    cmsDl.innerHTML = '';

    const temp = [];
    for (let i = 1; i < rows.length; i++) {
      const row  = rows[i];
      const name = String(row[nameIdx] || '').trim().toUpperCase();
      if (!name) continue;
      temp.push({
        name,
        hq:          hqIdx    >= 0 ? String(row[hqIdx]    || '').trim() : '',
        designation: desigIdx >= 0 ? String(row[desigIdx] || '').trim() : '',
        cmsId:       cmsIdx   >= 0 ? String(row[cmsIdx]   || '').trim() : '',
      });
    }
    temp.sort((a, b) => a.name.localeCompare(b.name));

    temp.forEach(c => {
      crewData[c.name] = { hq: c.hq, designation: c.designation, cmsId: c.cmsId };

      if (c.cmsId) {
        crewByCmsId[c.cmsId.toUpperCase()] = { name: c.name, hq: c.hq, designation: c.designation };
        const cmsOpt = document.createElement('option');
        cmsOpt.value = c.cmsId;
        cmsDl.appendChild(cmsOpt);
      }
    });

    return temp.length;
  }

  function populateCrewDatalistFromRecords(records) {
    if (!Array.isArray(records) || records.length === 0) throw new Error('No crew records returned');

    crewData = {};
    crewByCmsId = {};
    const cmsDl = document.getElementById('cmsIdList');
    cmsDl.innerHTML = '';

    const temp = records
      .map(r => ({
        name: String(r.name || '').trim().toUpperCase(),
        hq: String(r.hq || '').trim(),
        designation: String(r.designation || '').trim(),
        cmsId: String(r.cmsId || '').trim(),
      }))
      .filter(r => r.name);

    temp.sort((a, b) => a.name.localeCompare(b.name));

    temp.forEach(c => {
      crewData[c.name] = { hq: c.hq, designation: c.designation, cmsId: c.cmsId };

      if (c.cmsId) {
        crewByCmsId[c.cmsId.toUpperCase()] = { name: c.name, hq: c.hq, designation: c.designation };
        const cmsOpt = document.createElement('option');
        cmsOpt.value = c.cmsId;
        cmsDl.appendChild(cmsOpt);
      }
    });

    return temp.length;
  }

  // Load crew list via JSONP through the Apps Script Web App (bypasses CORS entirely,
  // no dependency on third-party proxy services).
  function loadCrewListViaJSONP() {
    return new Promise((resolve, reject) => {
      if (!SHEET_URL || SHEET_URL.includes('PASTE_YOUR')) {
        reject(new Error('SHEET_URL not configured'));
        return;
      }
      const callbackName = 'crewListCB_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
      const script = document.createElement('script');
      let done = false;

      function cleanup() {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      window[callbackName] = function (data) {
        done = true;
        cleanup();
        if (data && data.error) reject(new Error(data.error));
        else resolve(data);
      };

      script.onerror = function () {
        if (!done) { cleanup(); reject(new Error('JSONP script failed to load')); }
      };

      script.src = `${SHEET_URL}?action=crewlist&callback=${callbackName}`;
      document.body.appendChild(script);

      setTimeout(() => {
        if (!done) { cleanup(); reject(new Error('JSONP timeout')); }
      }, 10000);
    });
  }

  async function loadCrewList() {
    // Strategy 1: Apps Script JSONP — most reliable, no CORS or 3rd-party proxy dependency
    try {
      const records = await loadCrewListViaJSONP();
      const count = populateCrewDatalistFromRecords(records);
      showToast(`✅ ${count} crew loaded via Apps Script!`, 'success');
      return;
    } catch (err) {
      console.warn('Apps Script JSONP strategy failed:', err.message);
    }

    // Strategy 2-5: direct CSV fetch + proxy fallbacks (may be blocked by CORS or rate limits)
    const strategies = [
      async () => {
        const res = await fetch(CREW_CSV_URL, { signal: AbortSignal.timeout(8000) });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const csv = await res.text();
        return { count: populateCrewDatalist(parseCrewCSV(csv)), label: 'Google Sheets (direct)' };
      },
      async () => {
        const url = CREW_CORS_PROXIES[0](CREW_CSV_URL);
        const res = await fetch(url, { signal: AbortSignal.timeout(10000) });
        if (!res.ok) throw new Error('Proxy HTTP ' + res.status);
        const csv = await res.text();
        return { count: populateCrewDatalist(parseCrewCSV(csv)), label: 'allorigins proxy' };
      },
      async () => {
        const url = CREW_CORS_PROXIES[1](CREW_CSV_URL);
        const res = await fetch(url, { signal: AbortSignal.timeout(10000) });
        if (!res.ok) throw new Error('Proxy2 HTTP ' + res.status);
        const csv = await res.text();
        return { count: populateCrewDatalist(parseCrewCSV(csv)), label: 'corsproxy.io' };
      },
      async () => {
        const url = CREW_CORS_PROXIES[2](CREW_CSV_URL);
        const res = await fetch(url, { signal: AbortSignal.timeout(10000) });
        if (!res.ok) throw new Error('Proxy3 HTTP ' + res.status);
        const csv = await res.text();
        return { count: populateCrewDatalist(parseCrewCSV(csv)), label: 'codetabs proxy' };
      },
    ];

    for (let i = 0; i < strategies.length; i++) {
      try {
        const { count, label } = await strategies[i]();
        showToast(`✅ ${count} crew loaded via ${label}!`, 'success');
        return;
      } catch (err) {
        console.warn(`Crew list strategy ${i + 1} failed:`, err.message);
      }
    }
    showToast('❌ Could not load crew list. Check sheet sharing settings.', 'error');
  }

  function autoFillCrew(name) {
    const hqEl    = document.getElementById('hq');
    const desigEl = document.getElementById('designation');
    const cmsEl   = document.getElementById('cmsId');
    const data    = crewData[String(name || '').trim().toUpperCase()];

    if (data) {
      hqEl.value    = data.hq;
      desigEl.value = data.designation;
      cmsEl.value   = data.cmsId;
      [hqEl, desigEl, cmsEl].forEach(el => {
        if (el.value) { el.setAttribute('readonly', true); el.title = 'Auto-filled from Google Sheet'; }
        else { el.removeAttribute('readonly'); el.title = ''; }
      });
      showToast('✅ Auto-filled: ' + name, 'success');
    } else {
      [hqEl, desigEl, cmsEl].forEach(el => { el.removeAttribute('readonly'); el.title = ''; });
    }
  }

  // ===== Crew Name: SELECT-ONLY combobox (no manual/free-text entry allowed) =====
  (function setupCrewNameCombo() {
    const inputEl   = document.getElementById('crewName');
    const suggestEl = document.getElementById('crewNameSuggest');
    let activeIndex = -1;
    let currentMatches = [];
    let selectedValid = false; // true only when value came from a real selection

    function closeSuggest() {
      suggestEl.classList.remove('open');
      suggestEl.innerHTML = '';
      activeIndex = -1;
      currentMatches = [];
    }

    function renderSuggest(matches) {
      currentMatches = matches;
      activeIndex = -1;
      if (matches.length === 0) {
        suggestEl.innerHTML = '<div class="combo-empty">No matching crew name found</div>';
      } else {
        suggestEl.innerHTML = matches.map((name, i) =>
          `<div class="combo-item" data-idx="${i}">${name}</div>`
        ).join('');
      }
      suggestEl.classList.add('open');
    }

    function selectName(name) {
      inputEl.value = name;
      selectedValid = true;
      inputEl.classList.remove('combo-invalid');
      closeSuggest();
      autoFillCrew(name);
    }

    function rejectInvalidEntry() {
      // Value doesn't match any real crew record — force select-only, clear it.
      if (inputEl.value.trim() !== '') {
        showToast('⚠️ Please select a crew name from the list (manual entry not allowed)', 'error');
      }
      inputEl.value = '';
      selectedValid = false;
      const hqEl = document.getElementById('hq'), desigEl = document.getElementById('designation'), cmsEl = document.getElementById('cmsId');
      [hqEl, desigEl, cmsEl].forEach(el => { el.value = ''; el.removeAttribute('readonly'); el.title = ''; });
      closeSuggest();
    }

    inputEl.addEventListener('input', () => {
      selectedValid = false;
      inputEl.classList.remove('combo-invalid');
      const q = inputEl.value.trim().toUpperCase();
      if (!q) { closeSuggest(); return; }
      const allNames = Object.keys(crewData);
      const matches = allNames.filter(n => n.includes(q)).slice(0, 50);
      renderSuggest(matches);
    });

    inputEl.addEventListener('focus', () => {
      if (inputEl.value.trim() === '') {
        const allNames = Object.keys(crewData).slice(0, 50);
        if (allNames.length) renderSuggest(allNames);
      }
    });

    inputEl.addEventListener('keydown', (e) => {
      if (!suggestEl.classList.contains('open')) return;
      const items = suggestEl.querySelectorAll('.combo-item');
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        activeIndex = Math.min(activeIndex + 1, items.length - 1);
        items.forEach((it, i) => it.classList.toggle('active', i === activeIndex));
        if (items[activeIndex]) items[activeIndex].scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        activeIndex = Math.max(activeIndex - 1, 0);
        items.forEach((it, i) => it.classList.toggle('active', i === activeIndex));
        if (items[activeIndex]) items[activeIndex].scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (activeIndex >= 0 && currentMatches[activeIndex]) {
          selectName(currentMatches[activeIndex]);
        } else if (currentMatches.length === 1) {
          selectName(currentMatches[0]);
        } else {
          rejectInvalidEntry();
        }
      } else if (e.key === 'Escape') {
        closeSuggest();
      }
    });

    suggestEl.addEventListener('mousedown', (e) => {
      const item = e.target.closest('.combo-item');
      if (!item) return;
      e.preventDefault();
      const idx = parseInt(item.getAttribute('data-idx'), 10);
      if (currentMatches[idx]) selectName(currentMatches[idx]);
    });

    inputEl.addEventListener('blur', () => {
      // Delay so mousedown on a suggestion can register first
      setTimeout(() => {
        if (!selectedValid) {
          const exact = crewData[inputEl.value.trim().toUpperCase()];
          if (exact) {
            selectName(inputEl.value.trim().toUpperCase());
          } else {
            rejectInvalidEntry();
          }
        }
      }, 150);
    });

    document.addEventListener('click', (e) => {
      if (!inputEl.contains(e.target) && !suggestEl.contains(e.target)) closeSuggest();
    });
  })();

  // Reverse lookup: typing/selecting a CMS ID fills Crew Name, HQ and Designation.
  function autoFillByCmsId(cmsId) {
    const nameEl  = document.getElementById('crewName');
    const hqEl    = document.getElementById('hq');
    const desigEl = document.getElementById('designation');
    const data    = crewByCmsId[String(cmsId || '').trim().toUpperCase()];

    if (data) {
      nameEl.value  = data.name;
      hqEl.value    = data.hq;
      desigEl.value = data.designation;
      [hqEl, desigEl].forEach(el => {
        if (el.value) { el.setAttribute('readonly', true); el.title = 'Auto-filled from Google Sheet'; }
        else { el.removeAttribute('readonly'); el.title = ''; }
      });
      showToast('✅ Auto-filled: ' + data.name, 'success');
    } else {
      // Manually typed / unmatched CMS ID — unlock HQ & Designation for manual entry
      [hqEl, desigEl].forEach(el => { el.removeAttribute('readonly'); el.title = ''; });
    }
  }

  // Crew Name input/select-only behavior is fully handled by setupCrewNameCombo() above.

  const cmsIdEl = document.getElementById('cmsId');
  cmsIdEl.addEventListener('input',  (e) => autoFillByCmsId(e.target.value));
  cmsIdEl.addEventListener('change', (e) => autoFillByCmsId(e.target.value));

  document.addEventListener('DOMContentLoaded', loadCrewList);

  let rowCount = 0;

  function addRow() {
    rowCount++;
    const wrap = document.getElementById('entriesWrap');
    const card = document.createElement('div');
    card.className = 'entry-card';
    card.setAttribute('data-entry', rowCount);
    card.innerHTML = `
      <div class="entry-card-head">
        <span class="entry-num">Entry ${rowCount}</span>
        <button class="delete-btn" onclick="this.closest('.entry-card').remove()">✕ Remove</button>
      </div>
      <div class="entry-card-body">
        <div class="entry-grid">
          <div class="entry-field"><label>Name of Working LP/HQ</label><input type="text" name="lpNameHq"></div>
          <div class="entry-field"><label>Train No.</label><input type="text" name="trainNo"></div>
          <div class="entry-field"><label>Loco No.</label><input type="text" name="locoNo"></div>
          <div class="stn-row">
            <div class="stn-field"><label>From Stn.</label><input type="text" name="fromStation" list="stnList" autocomplete="off" oninput="this.classList.remove('field-invalid')"></div>
            <div class="stn-field"><label>Dep.</label><input type="text" name="depTime"></div>
            <div class="stn-field"><label>To Stn.</label><input type="text" name="toStation" list="stnList" autocomplete="off" oninput="this.classList.remove('field-invalid')"></div>
            <div class="stn-field"><label>Arrival</label><input type="text" name="arrTime"></div>
            <div class="stn-field"><label>Line</label>
              <select name="line">
                <option value="">--</option>
                <option value="UP">UP</option>
                <option value="UP MIDDLE">UP MIDDLE</option>
                <option value="UP JOINT LINE">UP JOINT LINE</option>
                <option value="DN">DN</option>
                <option value="DN MIDDLE">DN MIDDLE</option>
                <option value="DN JOINT LINE">DN JOINT LINE</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    `;
    wrap.appendChild(card);

    // Auto-fill Working LP Name/HQ, Train No, Loco No from the previous entry (still editable)
    const allCards = wrap.querySelectorAll('.entry-card');
    if (allCards.length > 1) {
      const prevCard = allCards[allCards.length - 2];
      ['lpNameHq', 'trainNo', 'locoNo'].forEach(fieldName => {
        const prevInput = prevCard.querySelector(`[name="${fieldName}"]`);
        const newInput  = card.querySelector(`[name="${fieldName}"]`);
        if (prevInput && newInput) newInput.value = prevInput.value;
      });
    }
  }

  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = type;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 4000);
  }

  function formatDateDDMMYYYY(isoDate) {
    if (!isoDate) return '';
    const parts = isoDate.split('-');
    if (parts.length !== 3) return isoDate;
    const [y, m, d] = parts;
    return `${d}/${m}/${y}`;
  }

  function collectData() {
    const timestamp = new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' });
    const header = {
      timestamp,
      crewDate:    formatDateDDMMYYYY(document.getElementById('crewDate').value),
      crewName:    document.getElementById('crewName').value,
      hq:          document.getElementById('hq').value,
      designation: document.getElementById('designation').value,
      groupCli:    document.getElementById('groupCli').value,
      cmsId:       document.getElementById('cmsId').value,
    };
    const entries = [];
    document.querySelectorAll('.entry-card').forEach((card, i) => {
      const get = name => { const el = card.querySelector(`[name="${name}"]`); return el ? el.value : ''; };
      entries.push({
        entryNo:     i + 1,
        lpNameHq:    get('lpNameHq'),
        trainNo:     get('trainNo'),
        locoNo:      get('locoNo'),
        fromStation: get('fromStation'),
        depTime:     get('depTime'),
        toStation:   get('toStation'),
        arrTime:     get('arrTime'),
        line:        get('line'),
      });
    });
    return { header, entries };
  }

  function clearInvalidMarks() {
    document.getElementById('groupCli').classList.remove('field-invalid');
    document.querySelectorAll('.entry-card [name="fromStation"], .entry-card [name="toStation"]')
      .forEach(el => el.classList.remove('field-invalid'));
  }

  // Mandatory: Group CLI (header) + From Stn / To Stn for every entry row.
  function validateMandatoryFields() {
    clearInvalidMarks();
    let firstInvalid = null;
    const problems = [];

    const groupCliEl = document.getElementById('groupCli');
    if (!groupCliEl.value.trim()) {
      groupCliEl.classList.add('field-invalid');
      if (!firstInvalid) firstInvalid = groupCliEl;
      problems.push('Group CLI');
    }

    const cards = document.querySelectorAll('.entry-card');
    if (cards.length === 0) {
      showToast('❌ Add at least one entry before submitting', 'error');
      return false;
    }

    cards.forEach((card, i) => {
      const fromEl = card.querySelector('[name="fromStation"]');
      const toEl   = card.querySelector('[name="toStation"]');
      if (!fromEl.value.trim()) {
        fromEl.classList.add('field-invalid');
        if (!firstInvalid) firstInvalid = fromEl;
        problems.push(`Entry ${i + 1}: From Stn.`);
      }
      if (!toEl.value.trim()) {
        toEl.classList.add('field-invalid');
        if (!firstInvalid) firstInvalid = toEl;
        problems.push(`Entry ${i + 1}: To Stn.`);
      }
    });

    if (problems.length > 0) {
      showToast('❌ Please fill mandatory field(s): ' + problems.join(', '), 'error');
      if (firstInvalid) { firstInvalid.focus(); firstInvalid.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
      return false;
    }
    return true;
  }

  let isSubmitted = false;

  let saveCloseTimer = null;
  function showSaving() {
    clearTimeout(saveCloseTimer);
    document.getElementById('saveCard').classList.remove('done');
    document.getElementById('saveIcon').textContent = '✋';
    document.getElementById('saveTitle').textContent = '⏳ Please wait — data saving...';
    document.getElementById('saveSub').textContent = 'Do not close or refresh this page';
    document.getElementById('saveOverlay').classList.add('open');
  }
  function showSaved() {
    document.getElementById('saveCard').classList.add('done');
    document.getElementById('saveIcon').textContent = '✅';
    document.getElementById('saveTitle').textContent = 'Data Saved';
    document.getElementById('saveSub').textContent = 'Your data has been saved successfully';
    clearTimeout(saveCloseTimer);
    saveCloseTimer = setTimeout(hideSaveOverlay, 3000);
  }
  function hideSaveOverlay() {
    clearTimeout(saveCloseTimer);
    document.getElementById('saveOverlay').classList.remove('open');
  }

  // Update a bottom-nav button's icon + label without destroying its structure
  function setNavBtn(btn, icon, label) {
    btn.querySelector('.nav-ico').textContent = icon;
    btn.querySelector('.nav-lbl').textContent = label;
  }

  // Keep BOTH the desktop button and the mobile bottom-nav button in sync.
  function setSubmitUI(state) {
    const desk = document.getElementById('submitBtn');
    const nav  = document.getElementById('navSubmit');
    const cfg = {
      idle: { dis: false, deskTxt: '✔ Submit to Google Sheet', ico: '✅', lbl: 'Submit',     bg: '' },
      busy: { dis: true,  deskTxt: '⏳ Submitting...',          ico: '⏳', lbl: 'Submitting', bg: '' },
      done: { dis: true,  deskTxt: '✅ Submitted',              ico: '✅', lbl: 'Submitted',  bg: 'grey' },
    }[state];
    desk.disabled = nav.disabled = cfg.dis;
    desk.textContent = cfg.deskTxt;
    setNavBtn(nav, cfg.ico, cfg.lbl);
    desk.style.background = cfg.bg ? 'linear-gradient(135deg,#7f8c8d,#95a5a6)' : '';
    nav.style.background  = cfg.bg ? '#555' : '';
    desk.title = nav.title = (state === 'done') ? 'Data already submitted' : '';
  }

  function setPdfUI(busy) {
    const desk = document.getElementById('pdfBtn');
    const nav  = document.getElementById('navPdf');
    desk.disabled = nav.disabled = busy;
    desk.textContent = busy ? '⏳ Generating...' : '⬇ Generate PDF';
    setNavBtn(nav, busy ? '⏳' : '📄', busy ? 'Generating' : 'PDF');
  }

  async function handleSubmit() {
    if (isSubmitted) {
      alert('⚠️ DATA ALREADY SUBMITTED');
      return;
    }

    if (!validateMandatoryFields()) return;

    setSubmitUI('busy');

    const payload = collectData();
    showSaving();
    const startedAt = Date.now();

    try {
      // Apps Script answers with a redirect, and a no-cors fetch can hang on it for a long
      // time even though the row is already written. So we wait for the request to be
      // accepted OR for a short grace period (3.5s), whichever comes first. A real network
      // failure still rejects immediately and is shown as an error.
      const sendReq = fetch(SHEET_URL, {
        method: 'POST',
        mode: 'no-cors',
        keepalive: true,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      sendReq.catch(() => {}); // avoid unhandled-rejection noise after the race is over
      await Promise.race([
        sendReq,
        new Promise(resolve => setTimeout(resolve, 3500)),
      ]);
      // no-cors returns opaque response, assume success if no network error
      // keep the animation visible for at least ~1s so it never just flashes
      const elapsed = Date.now() - startedAt;
      if (elapsed < 1000) await new Promise(r => setTimeout(r, 1000 - elapsed));
      isSubmitted = true;
      setSubmitUI('done');
      showSaved();
    } catch (err) {
      hideSaveOverlay();
      showToast('❌ Failed to connect. Check the Web App URL.', 'error');
      setSubmitUI('idle');
    }
  }

  function generatePDF() {
    if (!validateMandatoryFields()) return;

    setPdfUI(true);

    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
      const pageW = doc.internal.pageSize.getWidth();
      const margin = 10;

      // ── Header ──
      doc.setFillColor(26, 35, 126);
      doc.rect(0, 0, pageW, 22, 'F');
      doc.setFontSize(14);
      doc.setTextColor(255, 215, 0);
      doc.setFont('helvetica', 'bold');
      doc.text('SOUTH EAST CENTRAL RAILWAY — RAIPUR DIVISION', pageW / 2, 8, { align: 'center' });
      doc.setFontSize(10);
      doc.text('CREW LR DATA FORM', pageW / 2, 15, { align: 'center' });

      const ts = new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' });
      doc.setFontSize(7);
      doc.setTextColor(255, 215, 0);
      doc.text('Generated: ' + ts, pageW - margin, 20, { align: 'right' });

      let y = 28;

      // ── Crew Details ──
      const { header: td, entries } = collectData();
      doc.setFillColor(57, 73, 171);
      doc.rect(margin, y, pageW - margin * 2, 7, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(9);
      doc.setFont('helvetica', 'bold');
      doc.text('CREW DETAILS', pageW / 2, y + 5, { align: 'center' });
      y += 10;

      doc.setTextColor(26, 35, 126);
      doc.setFontSize(8);
      doc.setFont('helvetica', 'normal');
      const cols = [
        ['Date', td.crewDate],
        ['Crew Name', td.crewName],
        ['HQ', td.hq],
        ['Designation', td.designation],
        ['Group CLI', td.groupCli],
        ['CMS ID', td.cmsId],
      ];
      const colW = (pageW - margin * 2) / 3;
      cols.forEach(([label, val], idx) => {
        const cx = margin + (idx % 3) * colW;
        const cy = y + Math.floor(idx / 3) * 10;
        doc.setFont('helvetica', 'bold');
        doc.text(label + ':', cx, cy);
        doc.setFont('helvetica', 'normal');
        doc.text((val || '').toString().toUpperCase(), cx + 32, cy);
      });
      y += Math.ceil(cols.length / 3) * 10 + 4;

      // ── LR Table ──
      doc.setFillColor(57, 73, 171);
      doc.rect(margin, y, pageW - margin * 2, 7, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(9);
      doc.setFont('helvetica', 'bold');
      doc.text('LR DETAILS', pageW / 2, y + 5, { align: 'center' });
      y += 9;

      const tableHead = [['#', 'Working LP Name & HQ', 'Train No', 'Loco No', 'From Stn.', 'Dep.', 'To Stn.', 'Arrival', 'Line']];
      const tableBody = entries.map(e => [
        e.entryNo, e.lpNameHq, e.trainNo, e.locoNo, e.fromStation, e.depTime,
        e.toStation, e.arrTime, e.line
      ]);

      doc.autoTable({
        startY: y,
        head: tableHead,
        body: tableBody,
        margin: { left: margin, right: margin },
        styles: { fontSize: 7, cellPadding: 2, overflow: 'linebreak', textColor: [26, 35, 126] },
        headStyles: { fillColor: [26, 35, 126], textColor: [255, 215, 0], fontStyle: 'bold', halign: 'center' },
        alternateRowStyles: { fillColor: [240, 248, 255] },
        columnStyles: {
          0: { cellWidth: 8,  halign: 'center' },
          1: { cellWidth: 60 },
          2: { cellWidth: 22 },
          3: { cellWidth: 22 },
          4: { cellWidth: 26 },
          5: { cellWidth: 18 },
          6: { cellWidth: 26 },
          7: { cellWidth: 18 },
          8: { cellWidth: 18 },
        },
      });

      // ── Footer ──
      const pages = doc.internal.getNumberOfPages();
      for (let p = 1; p <= pages; p++) {
        doc.setPage(p);
        doc.setFontSize(7);
        doc.setTextColor(120, 120, 120);
        doc.text('South East Central Railway — Raipur Division | Crew LR Data Form', margin, doc.internal.pageSize.getHeight() - 5);
        doc.text(`Page ${p} of ${pages}`, pageW - margin, doc.internal.pageSize.getHeight() - 5, { align: 'right' });
      }

      const crew = (td.crewName || 'report').replace(/\s+/g, '_').toLowerCase();
      doc.save(`Crew_LR_Data_${crew}_${new Date().toISOString().slice(0,10)}.pdf`);
      showToast('✅ PDF generated and downloaded!', 'success');
    } catch (err) {
      console.error(err);
      showToast('❌ PDF generation failed. Check console.', 'error');
    } finally {
      setPdfUI(false);
    }
  }

  function clearForm() {
    if (!confirm('Clear the entire form? This cannot be undone.')) return;

    // Reset crew detail fields
    document.getElementById('crewDate').value = '';
    document.getElementById('crewName').value = '';
    document.getElementById('hq').value = '';
    document.getElementById('designation').value = '';
    document.getElementById('groupCli').value = '';
    document.getElementById('cmsId').value = '';
    ['hq', 'designation', 'cmsId'].forEach(id => {
      const el = document.getElementById(id);
      el.removeAttribute('readonly');
      el.title = '';
    });

    // Remove all entry cards and add one fresh blank entry
    document.getElementById('entriesWrap').innerHTML = '';
    rowCount = 0;
    addRow();

    // Re-enable submit button
    isSubmitted = false;
    setSubmitUI('idle');

    showToast('🗑️ Form cleared', 'info');
  }

  addRow();
</script>

// Serves the crew list as JSONP so the form's browser fetch is never blocked by CORS.
// Called as: YOUR_EXEC_URL?action=crewlist&callback=someFunctionName
function doGet(e) {
  var callback = e && e.parameter && e.parameter.callback;
  try {
    if (e && e.parameter && e.parameter.action === 'crewlist') {
      var ss     = SpreadsheetApp.openById(CREW_LIST_SHEET_ID);
      var sheet  = ss.getSheetByName(CREW_LIST_TAB_NAME);
      var values = sheet.getDataRange().getValues();
      var headers = values[0].map(function(h) { return String(h).trim().toUpperCase(); });

      var nameIdx = -1, hqIdx = -1, desigIdx = -1, cmsIdx = -1;
      for (var i = 0; i < headers.length; i++) {
        if (nameIdx  === -1 && headers[i].indexOf('NAME') !== -1) nameIdx = i;
        if (hqIdx    === -1 && (headers[i] === 'HQ' || headers[i].indexOf('H.Q') !== -1 || headers[i].indexOf('HEAD') !== -1)) hqIdx = i;
        if (desigIdx === -1 && headers[i].indexOf('DESIG') !== -1) desigIdx = i;
        if (cmsIdx   === -1 && headers[i].indexOf('CMS') !== -1) cmsIdx = i;
      }

      var records = [];
      for (var r = 1; r < values.length; r++) {
        var row  = values[r];
        var name = String(row[nameIdx] || '').trim().toUpperCase();
        if (!name) continue;
        records.push({
          name: name,
          hq: hqIdx >= 0 ? String(row[hqIdx] || '').trim() : '',
          designation: desigIdx >= 0 ? String(row[desigIdx] || '').trim() : '',
          cmsId: cmsIdx >= 0 ? String(row[cmsIdx] || '').trim() : ''
        });
      }

      var json = JSON.stringify(records);
      if (callback) {
        return ContentService.createTextOutput(callback + '(' + json + ');')
          .setMimeType(ContentService.MimeType.JAVASCRIPT);
      }
      return ContentService.createTextOutput(json).setMimeType(ContentService.MimeType.JSON);
    }
    return ContentService.createTextOutput('Crew LR Data Form backend is running.');
  } catch (err) {
    var errJson = JSON.stringify({ error: err.toString() });
    if (callback) {
      return ContentService.createTextOutput(callback + '(' + errJson + ');')
        .setMimeType(ContentService.MimeType.JAVASCRIPT);
    }
    return ContentService.createTextOutput(errJson).setMimeType(ContentService.MimeType.JSON);
  }
}
